[workspace]
resolver = "2"
members = [
    "crates/recovery-core",
    "crates/ntfs-parser",
    "crates/filesystem",
    "crates/scanner",
    "crates/carving",
    "crates/reconstruction",
    "crates/confidence",
    "crates/signatures",
    "crates/validation",
    "crates/storage",
    "crates/test-utils",
    "crates/recover-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Windows Data Recovery Team"]
license = "Proprietary"
repository = ""

[workspace.dependencies]
thiserror = "1.0.61"
anyhow = "1.0.86"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
bytes = "1.6.0"
byteorder = "1.5.0"
sha2 = "0.10.8"
hex = "0.4.3"
uuid = { version = "=1.6.1", features = ["v4", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }
bitflags = "2.5.0"
parking_lot = "0.12.3"
crossbeam-channel = "0.5.13"
rayon = "1.10.0"
tempfile = "=3.10.1"
getrandom = { version = "=0.2.15" }
clap = { version = "=4.4.18", features = ["derive"] }
